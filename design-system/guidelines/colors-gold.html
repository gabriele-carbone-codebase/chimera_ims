<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;margin:0}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(10,10,10,.06)}.sw b{font-weight:500;font-size:12px}.g{display:flex;gap:10px}</style></head><body><div class="g"><div class="sw"><i style="background:var(--gold-50)"></i><b>50</b><span class="m">--gold-50</span></div><div class="sw"><i style="background:var(--gold-100)"></i><b>100</b><span class="m">--gold-100</span></div><div class="sw"><i style="background:var(--gold-200)"></i><b>200</b><span class="m">--gold-200</span></div><div class="sw"><i style="background:var(--gold-300)"></i><b>300</b><span class="m">--gold-300</span></div><div class="sw"><i style="background:var(--gold-400)"></i><b>400</b><span class="m">--gold-400</span></div><div class="sw"><i style="background:var(--gold-500)"></i><b>500 ◆</b><span class="m">--gold-500</span></div><div class="sw"><i style="background:var(--gold-600)"></i><b>600</b><span class="m">--gold-600</span></div><div class="sw"><i style="background:var(--gold-700)"></i><b>700</b><span class="m">--gold-700</span></div><div class="sw"><i style="background:var(--gold-800)"></i><b>800</b><span class="m">--gold-800</span></div></div></body></html>
