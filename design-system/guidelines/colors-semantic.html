<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;margin:0}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary)}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid rgba(31,27,22,.06)}.sw b{font-weight:500;font-size:12px}.g{display:flex;gap:10px}</style></head><body><div class="g"><div class="sw"><i style="background:var(--sage-500)"></i><b>Success</b><span class="m">--sage-500</span></div><div class="sw"><i style="background:var(--sage-50)"></i><b>success-soft</b><span class="m">--sage-50</span></div><div class="sw"><i style="background:var(--amber-500)"></i><b>Warning</b><span class="m">--amber-500</span></div><div class="sw"><i style="background:var(--amber-50)"></i><b>warning-soft</b><span class="m">--amber-50</span></div><div class="sw"><i style="background:var(--brick-500)"></i><b>Danger</b><span class="m">--brick-500</span></div><div class="sw"><i style="background:var(--brick-50)"></i><b>danger-soft</b><span class="m">--brick-50</span></div><div class="sw"><i style="background:var(--slate-500)"></i><b>Info</b><span class="m">--slate-500</span></div><div class="sw"><i style="background:var(--slate-50)"></i><b>info-soft</b><span class="m">--slate-50</span></div></div></body></html>
